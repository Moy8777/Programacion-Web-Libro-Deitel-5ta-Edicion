<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Retroalimentación de visita al campus</title>
</head>
<body>

    <h1>Formulario de Retroalimentación de la Visita al Campus</h1>

    <form method="post" action="http://www.deitel.com">
        
        <!-- Nombre y Correo -->
        <p>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </p>

        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <!-- Casillas de verificación -->
        <p>
            <strong>¿Qué fue lo que más le gustó sobre el campus?</strong><br>
            <label><input type="checkbox" name="gustos" value="campus"> Campus</label><br>
            <label><input type="checkbox" name="gustos" value="estudiantes"> Estudiantes</label><br>
            <label><input type="checkbox" name="gustos" value="ubicacion"> Ubicación</label><br>
            <label><input type="checkbox" name="gustos" value="ambiente"> Ambiente</label><br>
            <label><input type="checkbox" name="gustos" value="dormitorios"> Dormitorios</label><br>
            <label><input type="checkbox" name="gustos" value="deportes"> Deportes</label>
        </p>

        <!-- Botones de opción (Radio) -->
        <p>
            <strong>¿Cómo supo sobre la universidad?</strong><br>
            <label><input type="radio" name="origen" value="amigos"> Amigos</label><br>
            <label><input type="radio" name="origen" value="television"> Televisión</label><br>
            <label><input type="radio" name="origen" value="internet"> Internet</label><br>
            <label><input type="radio" name="origen" value="otro"> Otro</label>
        </p>

        <!-- Área de texto para comentarios -->
        <p>
            <label for="comentarios"><strong>Comentarios adicionales:</strong></label><br>
            <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
        </p>

        <!-- Botones del formulario -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Restablecer">
        </p>

    </form>

</body>
</html>
