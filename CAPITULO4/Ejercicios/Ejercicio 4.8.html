<!DOCTYPE html>

<!-- Fig. 2.3: vinculos.html -->
<!-- Vínculos hacia otras páginas Web -->

<html>
<head>
    <meta charset="utf-8">
    <title>Vínculos</title>

    <!-- Hoja de estilo incrustada requerida por el Ejercicio 4.8 -->
    <style>
        /* Muestra los elementos h1 en color azul */
        h1 {
            color: blue;
        }

        /* Muestra todos los vínculos en azul y sin subrayar */
        a {
            color: blue;
            text-decoration: none;
        }

        /* Cambia el color de fondo a amarillo cuando el ratón pasa sobre un vínculo */
        a:hover {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>Estos son mis sitios favoritos:</h1>

    <p><strong>Haga clic en un nombre para visitar ese sitio.</strong></p>

    <!-- Crea cuatro hipervínculos de texto -->

    <p><a href="https://www.facebook.com">Facebook</a></p>
    <p><a href="https://www.twitter.com">Twitter</a></p>
    <p><a href="https://www.foursquare.com">Foursquare</a></p>
    <p><a href="https://www.google.com">Google</a></p>

</body>
</html>
