<!DOCTYPE html>

<!-- Fig. 4.1: linea.html -->
<!-- Uso de estilos en línea -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Estilos en L&iacute;nea</title>
   </head>
   <body>
      <p>Este texto no tiene ning&uacute;n estilo aplicado.</p>

      <!-- El atributo style te permite declarar -->
      <!-- estilos en línea. Debes separar múltiples -->
      <!-- propiedades de estilo con un punto y coma. -->
      <p style = "font-size: 20pt;">Este texto tiene aplicado el estilo 
         <em>font-size</em>, para que sea de 20pt.
      </p>

      <p style = "font-size: 20pt; color: deepskyblue;">
         Este texto tiene aplicados los estilos <em>font-size</em> y 
         <em>color</em>, para que sea de 20pt y azul cielo profundo.</p>
   </body>
</html>
