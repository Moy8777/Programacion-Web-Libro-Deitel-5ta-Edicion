<!DOCTYPE html>

<!-- Fig. 5.13 Modificada: Ejercicio 5.10.html -->
<!-- Elementos de Inclinación y de transformación en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 5.10 - Inclinar</title>
      <style type = "text/css">
         .skew .textbox 
         {
            margin-left: 75px;
            background: lightgreen;
            height: 100px;
            width: 200px;
            padding: 25px 0;
            text-align: center;
            font-size: 250%;
            border: 3px solid DarkGreen;
            border-radius: 15px;
            animation: skew 4s infinite alternate linear;
         }
         @keyframes skew 
         {
            0%   { transform: skewY(0deg) skewX(0deg); }
            50%  { transform: skewY(30deg) skewX(0deg); }
            100% { transform: skewY(30deg) skewX(30deg); }
         }
      </style>
   </head>
   <body>
      <div class = "box skew">
         <div class = "textbox">Inclinar Texto</div>
      </div>
   </body>
</html>
